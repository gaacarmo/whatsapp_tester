<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="Terminal running npm run demo: three numbers checked, one on WhatsApp, one not, one unknown">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171b"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="url(#bg)" stroke="#26282e"/>
  <circle cx="22" cy="20" r="5.5" fill="#3a3c43"/>
  <circle cx="40" cy="20" r="5.5" fill="#3a3c43"/>
  <circle cx="58" cy="20" r="5.5" fill="#3a3c43"/>
  <text x="380" y="24" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="12" fill="#6b6e78">wa-check</text>
  <line x1="0" y1="40" x2="760" y2="40" stroke="#1f2126"/>
  <g style="white-space:pre" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#c9cbd1">
    <text x="24" y="72"><tspan fill="#6b6e78">$</tspan> npm run demo</text>
    <text x="24" y="108" font-weight="600" fill="#eceef2">WhatsApp Tester<tspan font-weight="400" fill="#6b6e78">  ·  demo mode, no real lookups</tspan></text>
    <text x="24" y="140"><tspan fill="#5fb3c4">›</tspan> Starting demo session…</text>
    <text x="24" y="162"><tspan fill="#5fb3c4">›</tspan> Checking 3 numbers, one at a time</text>
    <text x="40" y="196" fill="#6b6e78">1/3</text><text x="84" y="196">+55 ••••••• 4567</text><text x="250" y="196" fill="#5cc68a">●  on WhatsApp</text>
    <text x="40" y="218" fill="#6b6e78">2/3</text><text x="84" y="218">+55 •••••• 0000</text><text x="250" y="218" fill="#d9b45a">?  unknown</text>
    <text x="40" y="240" fill="#6b6e78">3/3</text><text x="84" y="240">+55 ••••••• 7777</text><text x="250" y="240" fill="#e0726e">○  not on WhatsApp</text>
    <text x="40" y="274"><tspan font-weight="600" fill="#eceef2">3</tspan> checked  <tspan fill="#6b6e78">·</tspan>  <tspan fill="#5cc68a">1</tspan> on  <tspan fill="#6b6e78">·</tspan>  <tspan fill="#e0726e">1</tspan> not  <tspan fill="#6b6e78">·</tspan>  <tspan fill="#d9b45a">1</tspan> unknown</text>
    <text x="24" y="314" fill="#6b6e78">25 per run · 60 per day · 8–15 s between checks</text>
  </g>
</svg>
